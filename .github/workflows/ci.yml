name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Check formatting
        run: uv run ruff format --check src/jevscan/cli/render.py src/jevscan/core/config.py src/jevscan/core/client.py tests/conftest.py tests/test_config.py tests/test_client.py tests/test_cli_and_reports.py

      - name: Lint
        run: uv run ruff check src/jevscan/cli/render.py src/jevscan/core/config.py src/jevscan/core/client.py tests/conftest.py tests/test_config.py tests/test_client.py tests/test_cli_and_reports.py

      - name: Type-check
        run: uv run ty check

      - name: Test
        run: uv run pytest -q -rs

      - name: Build distributions
        run: uv build
