[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "py3-jevscan"
description = "Parallel, configuration-driven semantic code quality scanning with Tree-sitter and Jev"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12, <4"
authors = [{ name = "Alexander Knott", email = "alexander.knott@r-kom.de" }]
keywords = ["code-quality", "tree-sitter", "jev", "lint", "static-analysis"]
classifiers = [
  "Intended Audience :: Developers",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = ["version", "dependencies"]

[project.scripts]
jevscan = "jevscan.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
jevscan = ["data/*.toml", "py.typed"]

[tool.setuptools.dynamic]
version = { attr = "jevscan.__version__" }
dependencies = { file = ["requirements.txt"] }

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "ty>=0.0.1,<1",
  "build>=1.2,<2",
  "radon>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = ["parser: requires the real Tree-sitter runtime and bundled grammars"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "S", "N", "C4", "SIM", "RET", "PTH", "LOG", "TRY", "PERF", "ARG"]
ignore = [
  "PTH113", "PTH118", "PTH119", "PTH120", "PTH123", "TRY003", "B904", "S101", "S108",
  "SIM108", "PERF203", "UP007", "UP035", "UP045", "UP006",
]

[tool.ruff.format]
preview = true

[tool.ty.environment]
python-version = "3.12"
