  - name: JEV16
    title: untruthful-success-signal
    ruleset: JEV
    enrich_on:
    - missing_evidence
    - reduced_context
    enrichment_families:
    - callers
    - callees
    - tests
    - enclosing_context
    target: unit
    context: owner
    applies_to:
    - function
    - method
    - closure
    require_body: true
    targeted_enrichment:
      when_choices:
      - insufficient_context
    question:
      type: choice
      instructions: Select exactly one outcome for a completion or readiness signal
        in the target. Require a visible success/completion/readiness signal, a required
        externally observable postcondition such as output, flush, commit, delivery,
        acknowledgement, or registration, and a reachable path where that postcondition
        is absent. Choose false_success only when the success claim hides failure or
        partial state. Choose truthful_success when failure is propagated or success is
        claimed only after the required postcondition, and explicit_partial_success
        when an accepted or partial state is surfaced honestly. Optional best-effort
        telemetry does not invalidate truthful success, and atomic publication is a
        clean contract. Choose not_applicable when no required externally observable
        postcondition or success signal is established. Choose insufficient_context
        when requiredness, the postcondition, reachability, or signal semantics are
        not visible. Do not infer requiredness from names alone.
      criteria:
        false_success: A visible success, completion, or readiness signal is reachable
          despite a required externally observable output, flush, commit, delivery,
          acknowledgement, registration, or equivalent postcondition being absent on
          that path, without exposing failure or partial state.
        truthful_success: Failure is propagated or the success/completion/readiness
          signal is reachable only after the required externally observable postcondition
          succeeds. Atomic publication and optional best-effort telemetry are compatible
          with this outcome.
        explicit_partial_success: The target explicitly exposes an accepted, pending,
          partial, or otherwise non-complete status when the required postcondition
          is not yet complete, rather than claiming full success.
        not_applicable: No visible required externally observable postcondition paired
          with a success/completion/readiness signal is established.
        insufficient_context: A signal or externally visible operation is present, but
          the postcondition's requiredness, its reachable failure path, or the meaning
          of the success claim is not established by the supplied evidence.
    report:
      message: A success signal appears reachable without a required externally observable
        postcondition.
      blocks_exit: false
      choices:
      - false_success
      not_applicable_choices:
      - not_applicable
      uncertain_choices:
      - insufficient_context
      levels:
        warning:
          min_probability: 0.59
          min_confidence: 0.49
        error:
          min_probability: 0.92
          min_confidence: 0.7
