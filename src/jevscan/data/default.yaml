# Project rules and overrides merge by name; built-ins remain active unless disabled or ignored.
version: 4
scan:
  include: ['*.py', '*.pyi', '*.rs', '*.pl', '*.pm', '*.t', '*.ts', '*.tsx', '*.mts', '*.cts', '*.js', '*.jsx',
    '*.mjs', '*.cjs']
  exclude: [.git/, .venv/, venv/, node_modules/, target/, dist/, build/, __pycache__/, .jevscan-cache/, vendor/,
    '*.min.js']
  respect_gitignore: true
  jobs: 0
  batch_size: 8
  queue_size: 8
  max_file_bytes: 2000000
  max_units_per_file: 10000
jev:
  model: jev-latest
  concurrency: 16
  requests_per_minute: 600
  timeout_seconds: 30
  retries: 3
  max_retry_delay: 60
evaluation:
  max_context_tokens: 28000
  max_total_tokens: 56000
  token_reserve: 512
  bytes_per_token: 3.0
  max_request_bytes: 1048576
  max_questions: 64
  oversized_context: reduce
compaction:
  context_tokens: 24000
  max_rounds: 3
  max_candidates: 32
  max_calls_per_file: 12
  semantic: true
enrichment:
  enabled: true
  max_checks_per_file: 12
  max_calls_per_file: 36
  max_candidates: 12
  max_evidence: 3
  min_route_probability: 0.7
  min_route_confidence: 0.5
  min_relevance: 0.65
  max_source_files: 1000
  max_source_bytes: 16777216
  min_evidence_probability: 0.6
cache:
  enabled: true
  path: .jevscan-cache/results.sqlite3
  ttl_seconds: 86400
lint:
  select: [ALL]
  ignore: []
rulesets:
  JEV:
    enabled: true
    description: Built-in semantic code-quality checks
  project:
    enabled: true
    description: Project-specific checks
rules:
  - name: JEV01
    title: mixed-responsibilities
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    question:
      type: noul
      instructions: Does `source` interleave independently meaningful responsibilities in a way that makes this
        operation harder to understand? Do not flag a cohesive orchestration function merely because it calls several
        different operations. Length alone is not evidence.
    report:
      message: This operation appears to interleave responsibilities that would be clearer as distinct operations.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.5
        error:
          min_probability: 0.9
  - name: JEV02
    title: unclear-control-flow
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    question:
      type: score
      instructions: How difficult is the main execution path through `source` to follow? Distinguish unavoidable
        domain branching from avoidable structural confusion.
      criteria: ['Clear execution path and explicit transitions, including necessary domain branching.', 'Mostly
          clear, with some local complexity that does not obscure the operation.', Interleaved concerns or nested
          branches substantially obscure the operation., Tangled control flow makes the operation and its important
          transitions difficult to determine.]
    report:
      message: Interleaved concerns or nesting appear to obscure the main execution path.
      levels:
        warning:
          min_score: 1.0
          min_confidence: 0.6
        error:
          min_score: 2.0
          min_confidence: 0.7
  - name: JEV03
    title: mixed-abstraction-levels
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    question:
      type: noul
      instructions: Does `source` mix high-level orchestration with substantial low-level parsing, resource bookkeeping,
        or implementation detail such that the main operation is obscured? A small necessary detail or explicit
        cleanup does not by itself establish a problem.
    report:
      message: High-level orchestration appears mixed with substantial low-level implementation detail.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.5
        error:
          min_probability: 0.9
  - name: JEV04
    title: redundant-validation
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    target: unit
    context: file
    applies_to: [function, method, closure]
    require_body: true
    question:
      type: choice
      instructions: Which statement about repeated validation in `source` is supported by the supplied code? First
        determine whether the target visibly performs a validation or recheck that could plausibly duplicate an earlier
        guarantee. If no such repeated check is visible, choose justified_or_absent; do not use insufficient_context
        merely because callers or contracts are absent. Only choose insufficient_context when a concrete repeated check
        is visible and deciding whether it is redundant requires a missing upstream guarantee or intervening
        boundary, mutation, or concurrency. Type annotations, names, and absent callers do not prove an invariant.
      criteria:
        demonstrably_redundant: The supplied implementation explicitly establishes an invariant and later rechecks
          it without a new boundary or invalidating operation.
        justified_or_absent: There is no repeated check, or the repeated check protects a real boundary or invalidation
          risk.
        insufficient_context: A concrete repeated validation is visible, but whether it duplicates an earlier guarantee
          cannot be decided because the necessary upstream guarantee or intervening behavior is missing from the
          supplied evidence.
    report:
      message: A validation check appears to repeat an invariant explicitly established in the supplied code.
      choices: [demonstrably_redundant]
      uncertain_choices: [insufficient_context]
      levels:
        warning:
          min_probability: 0.6
          min_confidence: 0.5
        error:
          min_probability: 0.92
          min_confidence: 0.7
  - name: JEV05
    title: hidden-invariant-failure
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    target: unit
    context: file
    applies_to: [function, method, closure]
    require_body: true
    question:
      type: choice
      instructions: Does a default value, swallowed exception, best-effort continuation, or similar fallback in
        `source` conceal a violation of an internal invariant? First identify such behavior in the target. If none is
        visible, choose legitimate_behavior; do not use insufficient_context merely because callers, contracts, or
        invariants outside the file are absent. Only choose insufficient_context when the fallback behavior is visible
        but deciding whether it conceals a bug requires a missing invariant or intended failure contract. Legitimate
        I/O failures, cancellation, user input errors, and documented optional behavior are not invariant violations.
      criteria:
        concealed_bug: A clearly established internal invariant is violated and the implementation silently conceals
          it.
        legitimate_behavior: The behavior handles a legitimate runtime condition or no such concealment is present.
        insufficient_context: A concrete fallback, swallowed failure, or best-effort continuation is visible, but the
          invariant or intended failure behavior needed to classify it cannot be established from the supplied evidence.
    report:
      message: A fallback or swallowed failure appears to conceal a violation of an established internal invariant.
      choices: [concealed_bug]
      uncertain_choices: [insufficient_context]
      levels:
        warning:
          min_probability: 0.6
          min_confidence: 0.5
        error:
          min_probability: 0.92
          min_confidence: 0.7
  - name: JEV06
    title: unhelpful-decomposition
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context, applicability]
    require_members: true
    target: unit
    context: file
    applies_to: [class, impl, package, module]
    question:
      type: choice
      instructions: Do the helpers visible in `source` make their callers easier to understand by naming coherent
        operations, or mainly add forwarding or line-splitting indirection? First determine whether the target actually
        contains helper decomposition relevant to this question. If no such decomposition is present, choose
        not_applicable. If the visible caller/helper relationship is sufficient, choose meaningful or
        needless_indirection. Only choose insufficient_context when helper decomposition is visibly present but missing
        helper implementations or callers are required to distinguish those outcomes. Small helpers, interface adapters,
        decorators, and required protocol methods are not inherently bad.
      criteria:
        meaningful: Decomposition gives coherent operations meaningful names or serves an evident interface requirement.
        needless_indirection: Visible helpers mainly move lines or forward arguments without hiding meaningful detail,
          and visibly make the caller harder to follow.
        not_applicable: No helper decomposition is present in the target; a data-only type, exception, enum or interface
          declaration is not a decomposition defect.
        insufficient_context: Helper decomposition is visibly present, but a relevant helper implementation or caller
          needed to distinguish meaningful decomposition from needless indirection is missing from the supplied evidence.
    report:
      message: Helper indirection appears to obscure the caller without providing meaningful decomposition.
      choices: [needless_indirection]
      not_applicable_choices: [not_applicable]
      uncertain_choices: [insufficient_context]
      levels:
        warning:
          min_probability: 0.6
          min_confidence: 0.5
        error:
          min_probability: 0.9
          min_confidence: 0.7
  - name: JEV07
    title: fragmented-ownership
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    target: file
    context: file
    question:
      type: noul
      instructions: Does `source` maintain duplicate authoritative state or distribute lifecycle bookkeeping across
        conflicting owners in a way that visibly creates synchronization obligations? Derived caches and deliberately
        synchronized representations are not problems merely because data is repeated; require a concrete ownership
        conflict in the supplied implementation.
    report:
      message: State or lifecycle bookkeeping appears to have competing authoritative owners.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.5
        error:
          min_probability: 0.92
  - name: JEV08
    title: incohesive-owner
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    target: unit
    context: file
    applies_to: [class, impl, package, module]
    question:
      type: noul
      instructions: Does this owner in `source` combine unrelated responsibilities whose state and behavior have
        little meaningful connection? A domain aggregate, a cohesive facade, or one implementation of a required
        interface is not incohesive merely because it contains many methods.
    report:
      message: This owner appears to combine unrelated state and behavior.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.5
        error:
          min_probability: 0.9
  - name: JEV09
    title: duplicated-behavior
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    target: file
    context: file
    question:
      type: noul
      instructions: Does `source` contain materially duplicated implementations of the same owned behavior, creating
        a clear maintenance obligation to keep them in sync? Similar syntax alone, distinct trust boundaries, or
        required trait/interface implementations are insufficient.
    report:
      message: The same owned behavior appears implemented more than once and may need to be maintained in sync.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.5
        error:
          min_probability: 0.93
