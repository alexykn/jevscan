    - closure
    require_body: true
    targeted_enrichment:
      when_choices:
      - insufficient_context
    question:
      type: choice
      instructions: Select exactly one outcome for retry behavior in the target. Use
        only the supplied source. Before unsafe_retry, require (1) a dispatch of one
        logical externally visible effect, (2) source-visible evidence that the effect
        occurred or was committed before completion became unknown, (3) a reachable
        replay of the same logical effect, and (4) a concrete duplicate or reorder consequence
        visible in the supplied source. A timeout, generic exception, API name, argument
        name, comment, type shape, test, caller, or provider convention does not establish
        post-dispatch ambiguity or deduplication when the relevant implementation or
        contract is absent. Choose unsafe_retry only when all four facts are visible
        and no source-visible stable-key deduplication, operation-ID transaction, replay-safe
        implementation contract, or compensation/reconciliation prevents the consequence.
        Choose safe_retry when such protection is visible. Choose explicitly_nonretryable
        when ambiguity is surfaced as pending/non-retryable and the target does not
        replay. Choose not_applicable when no dispatch/replay shape is visible. Choose
        insufficient_context when a retry shape is visible but ambiguity, consequence,
        logical identity, or the safety contract is not established.
      criteria:
        unsafe_retry: The supplied source visibly shows an externally visible dispatch
          whose effect occurs before an unknown completion, a reachable replay of the
          same logical effect, and a concrete duplicate or reorder consequence; no source-visible
          deduplication, operation-ID transaction, replay-safe implementation contract,
          or compensation/reconciliation prevents it.
        safe_retry: The supplied source visibly shows a replay after an ambiguous completion
          and also shows stable-key deduplication, an operation-ID transaction, a replay-safe
          implementation contract, or compensation/reconciliation that prevents the
          duplicate or reorder.
        explicitly_nonretryable: The supplied source visibly shows an ambiguous completion
          being recorded or returned as pending/non-retryable, with no replay of the
          logical externally visible effect.
        not_applicable: No externally visible dispatch followed by an ambiguous completion
          and reachable replay of one logical effect is visible.
        insufficient_context: A possible retry or external call is visible, but the
          source does not establish post-dispatch ambiguity, the logical effect, its
          duplicate or reorder consequence, or the governing safety contract. Do not
          infer these facts from an opaque provider, names, comments, tests, callers,
          types, or API convention.
    report:
      message: An externally visible effect appears to be replayed after a source-established
        ambiguous completion without a retry-safety contract.
      blocks_exit: false
      choices:
