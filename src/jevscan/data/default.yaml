# Project rules and overrides merge by name; built-ins remain active unless disabled or ignored.
version: 4
scan:
  include: ['*.py', '*.pyi', '*.rs', '*.pl', '*.pm', '*.t', '*.ts', '*.tsx', '*.mts', '*.cts', '*.js', '*.jsx',
    '*.mjs', '*.cjs']
  exclude: [.git/, .venv/, venv/, node_modules/, target/, dist/, build/, __pycache__/, .jevscan-cache/, vendor/,
    '*.min.js']
  respect_gitignore: true
  jobs: 0
  batch_size: 8
  queue_size: 8
  max_file_bytes: 2000000
  max_units_per_file: 10000
  max_full_file_lines: 3000
jev:
  model: jev-latest
  concurrency: 16
  requests_per_minute: 600
  timeout_seconds: 30
  retries: 3
  max_retry_delay: 60
evaluation:
  max_context_tokens: 28000
  max_total_tokens: 56000
  token_reserve: 512
  bytes_per_token: 3.0
  max_request_bytes: 1048576
  max_questions: 64
  oversized_context: reduce
compaction:
  context_tokens: 24000
  max_rounds: 3
  max_candidates: 32
  max_calls_per_file: 12
  semantic: true
enrichment:
  enabled: true
  mode: targeted
  max_checks_per_file: 12
  max_calls_per_file: 36
  max_candidates: 12
  max_evidence: 3
  min_route_probability: 0.7
  min_route_confidence: 0.5
  min_relevance: 0.65
  max_source_files: 1000
  max_source_bytes: 16777216
  min_evidence_probability: 0.6
budget:
  max_requests: 1500
  max_input_tokens: 5000000
  max_cost: null
  input_cost_per_million: 0.042
cache:
  enabled: true
  path: .jevscan-cache/results.sqlite3
  ttl_seconds: 86400
lint:
  select: [ALL]
  ignore: []
rulesets:
  JEV:
    enabled: true
    description: Built-in semantic code-quality checks
  project:
    enabled: true
    description: Project-specific checks
rules:
  - name: JEV01
    title: mixed-responsibilities
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callees, enclosing_context]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    question:
      type: noul
      instructions: Does the target interleave two or more independently meaningful responsibilities inside one
        operation, rather than only orchestrating cohesive steps?
      criteria:
        "true": The target implements multiple independently meaningful responsibilities whose control or state handling
          is interleaved.
        "false": The target has one coherent responsibility or only delegates cohesive steps; no concrete interleaving is
          shown.
    report:
      message: This operation appears to interleave responsibilities that would be clearer as distinct operations.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.71
        error:
          min_probability: 0.9
  - name: JEV02
    title: unclear-control-flow
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callees, enclosing_context]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    question:
      type: score
      instructions: Select the level that describes how many important execution transitions in the target are
        obscured by its control-flow structure. Judge path traceability, not domain difficulty or line count.
      criteria: ['0: The main path and each important transition are direct and explicit.',
        '1: One local nesting or branch complication exists, but all important transitions remain easy to trace.',
        '2: Multiple nested or interleaved branches obscure at least one important transition.',
        '3: Important transitions are scattered or tangled enough that the main path cannot be reconstructed directly.']
    report:
      message: Interleaved concerns or nesting appear to obscure the main execution path.
      levels:
        warning:
          min_score: 1.52
          min_confidence: 0.7
        error:
          min_score: 2.0
          min_confidence: 0.7
  - name: JEV03
    title: mixed-abstraction-levels
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callees, enclosing_context]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    question:
      type: noul
      instructions: Does the target mix high-level orchestration with a substantial low-level implementation concern
        that obscures its primary operation?
      criteria:
        "true": The target interleaves orchestration with substantial parsing, resource bookkeeping, or other low-level
          detail.
        "false": The target stays at one abstraction level, or its small necessary details and cleanup do not obscure the
          primary operation.
    report:
      message: High-level orchestration appears mixed with substantial low-level implementation detail.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.56
        error:
          min_probability: 0.9
  - name: JEV04
    title: redundant-validation
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callers, callees]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    applicability:
      requires_any: [validation_candidate]
    targeted_enrichment:
      when_choices: [insufficient_context]
    question:
      type: choice
      instructions: Select exactly one outcome for repeated validation in the target. A repeated check is visible only
        when two validation operations can be identified. If no repeated validation is visible, choose
        justified_or_absent. Use insufficient_context only when a repeated validation is visible but the missing
        guarantee or boundary fact determines its classification.
      criteria:
        demonstrably_redundant: A visible operation establishes a specific invariant and the target later checks that
          same invariant again without a new boundary, mutation, or concurrency risk.
        justified_or_absent: No repeated validation is visible, or every visible repeat follows a new boundary or
          possible invalidation.
        insufficient_context: A concrete repeated validation is visible, but the missing upstream guarantee or boundary
          fact is required to choose between redundant and justified_or_absent.
    report:
      message: A validation check appears to repeat an invariant explicitly established in the supplied code.
      choices: [demonstrably_redundant]
      uncertain_choices: [insufficient_context]
      levels:
        warning:
          min_probability: 0.6
          min_confidence: 0.45
        error:
          min_probability: 0.92
          min_confidence: 0.7
  - name: JEV05
    title: hidden-invariant-failure
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callers, callees, tests]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    applicability:
      requires_any: [fallback_candidate]
    targeted_enrichment:
      when_choices: [insufficient_context]
    question:
      type: choice
      instructions: Select exactly one outcome for fallback or swallowed-failure behavior visible in the target. A
        fallback behavior is visible only when a fallback, swallowed failure, or best-effort continuation is concrete.
        If no such behavior is visible, choose legitimate_behavior. Use insufficient_context only when the visible
        behavior needs a missing invariant or failure contract to classify.
      criteria:
        concealed_bug: A visible fallback or swallowed failure silently hides a violation of an invariant established by
          the supplied evidence.
        legitimate_behavior: No fallback or swallowed failure is visible, or the behavior handles a legitimate runtime
          condition such as I/O failure, cancellation, input error, or documented optional behavior.
        insufficient_context: A concrete fallback or swallowed failure is visible, but a missing invariant or intended
          failure contract is required to choose between concealed_bug and legitimate_behavior.
    report:
      message: A fallback or swallowed failure appears to conceal a violation of an established internal invariant.
      choices: [concealed_bug]
      uncertain_choices: [insufficient_context]
      levels:
        warning:
          min_probability: 0.6
          min_confidence: 0.5
        error:
          min_probability: 0.92
          min_confidence: 0.7
  - name: JEV06
    title: unhelpful-decomposition
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context, applicability]
    enrichment_families: [callees, enclosing_context]
    require_members: true
    target: unit
    context: owner
    applies_to: [class, impl, package, module]
    applicability:
      requires_any: [helper_relationship]
    targeted_enrichment:
      when_choices: [insufficient_context]
    question:
      type: choice
      instructions: Select exactly one outcome for helper decomposition in the target. helper decomposition is visibly
        present only when an implemented caller/helper relationship is visible. If no caller/helper decomposition is
        visible, choose not_applicable. If it is visible but a missing implementation or caller is needed to classify
        it, choose insufficient_context.
      criteria:
        meaningful: Each visible helper hides a coherent operation behind a meaningful name or satisfies an evident
          interface requirement, and the caller is clearer.
        needless_indirection: Visible helpers only forward arguments or move lines without hiding meaningful detail,
          and the caller is less clear because of that indirection.
        not_applicable: No helper decomposition is visible in the target; data-only types and declarations are not
          decomposition defects.
        insufficient_context: Helper decomposition is visibly present, but a missing helper implementation or caller
          is required to distinguish meaningful from needless_indirection.
    report:
      message: Helper indirection appears to obscure the caller without providing meaningful decomposition.
      choices: [needless_indirection]
      not_applicable_choices: [not_applicable]
      uncertain_choices: [insufficient_context]
      levels:
        warning:
          min_probability: 0.45999999999999996
          min_confidence: 0.29
        error:
          min_probability: 0.9
          min_confidence: 0.7
  - name: JEV07
    title: fragmented-ownership
    ruleset: JEV
    enrich: false
    enrich_on: [missing_evidence, reduced_context]
    target: file
    context: file
    question:
      type: noul
      instructions: Does the file assign the same authoritative state or lifecycle bookkeeping to conflicting owners,
        creating a concrete synchronization obligation?
      criteria:
        "true": Two or more owners visibly act as authoritative for the same state or lifecycle transition, creating a
          synchronization obligation.
        "false": State has one authoritative owner, or repeated data is a derived cache or deliberately synchronized
          representation without a concrete ownership conflict.
    report:
      message: State or lifecycle bookkeeping appears to have competing authoritative owners.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.5
        error:
          min_probability: 0.92
  - name: JEV08
    title: incohesive-owner
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callees, enclosing_context]
    target: unit
    context: owner
    applies_to: [class, impl, package, module]
    applicability:
      requires_any: [executable_behavior]
    question:
      type: noul
      instructions: Does this owner combine two or more unrelated responsibilities with weakly connected state or
        behavior?
      criteria:
        "true": The owner contains multiple responsibilities with weakly connected state or behavior and no clear
          cohesive boundary.
        "false": The owner is cohesive, a domain aggregate or facade, or one implementation of a required interface;
          method count alone is not evidence.
    report:
      message: This owner appears to combine unrelated state and behavior.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.47
        error:
          min_probability: 0.9
  - name: JEV09
    title: duplicated-behavior
    ruleset: JEV
    enrich: false
    enrich_on: [missing_evidence, reduced_context]
    target: file
    context: file
    question:
      type: noul
      instructions: Does the file contain materially duplicated implementations of the same owned behavior, creating a
        maintenance obligation to keep them in sync? Similar syntax alone, distinct trust boundaries, and required
        trait/interface implementations are insufficient.
      criteria:
        "true": At least two implementations contain materially duplicated owned behavior with a concrete obligation to
          keep them synchronized.
        "false": No implementation is materially duplicated behavior, or similarity is explained by a distinct boundary
          or required implementation.
    report:
      message: The same owned behavior appears implemented more than once and may need to be maintained in sync.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.73
        error:
          min_probability: 0.93
  - name: JEV10
    title: unaccounted-partial-state-transition
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callees, enclosing_context]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    applicability:
      requires_any: [state_transition_candidate]
    targeted_enrichment:
      when_choices: [insufficient_context]
    question:
      type: choice
      instructions: >-
        Select exactly one outcome for narrow temporal atomicity in the target.
        Choose unaccounted_partial_transition only when two or more
        semantically coupled externally observable state effects are visible,
        a reachable failure, cancellation, early return, or retry can leave
        only a subset visible or durable, and there is no atomic boundary,
        rollback, compensation, reconciliation, or explicitly valid
        intermediate or progressive contract. Exclude independent logging,
        metrics, or caches, local temporary construction, and a complete build
        followed by one publication. Choose accounted_transition when those
        effects are covered by such a boundary or contract, or no qualifying
        transition is visible. Choose insufficient_context when reachability or
        the local transition contract is unresolved. Do not classify an
        explicitly progressive or restartable workflow as
        unaccounted_partial_transition, and do not classify independent
        best-effort audit or telemetry as a coupled transition when their
        failure cannot invalidate the primary transition; classify such cases
        as accounted_transition.
      criteria:
        unaccounted_partial_transition: >-
          Two or more semantically coupled externally observable state effects
          are visible; a reachable failure, cancellation, early return, or
          retry can leave only a subset visible or durable; and no atomic
          boundary, rollback, compensation, reconciliation, or explicitly valid
          intermediate or progressive contract covers that subset.
        accounted_transition: >-
          The effects are covered by an atomic boundary, rollback, compensation,
          reconciliation, or explicitly valid intermediate or progressive
          contract, or the target shows no qualifying transition. Independent
          logging, metrics, caches, local temporary construction, and complete
          build-then-one-publication patterns are excluded. Do not classify an
          explicitly progressive or restartable workflow as
          unaccounted_partial_transition, and do not classify independent
          best-effort audit or telemetry as a coupled transition when their
          failure cannot invalidate the primary transition; classify such cases
          as accounted_transition.
        insufficient_context: >-
          A qualifying partial transition may exist, but reachability or the
          local transition contract is unresolved.
    report:
      message: A partial state transition appears to be left unaccounted for.
      choices: [unaccounted_partial_transition]
      uncertain_choices: [insufficient_context]
      levels:
        warning:
          min_probability: 0.6
          min_confidence: 0.5
        error:
          min_probability: 0.92
          min_confidence: 0.7
  - name: JEV11
    title: terminal-state-reentry
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callers, callees, tests, enclosing_context]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    targeted_enrichment:
      when_choices: [insufficient_context]
    question:
      type: choice
      instructions: >-
        Select exactly one outcome for terminal lifecycle state in the target.
        Choose terminal_reentry only when a source-established terminal state
        has a reachable operation that accepts new work, performs a stateful
        effect, or reacquires a resource, and the target does not reject it
        before that effect and does not show a proven restart, reset,
        reinitialization, or fresh generation. Choose valid_restart_or_reuse
        for an explicit restart, reset, reinitialization, or fresh-generation
        contract; allowed_terminal_operation for an explicitly allowed
        terminal operation; and no_terminal_reentry when no qualifying
        reentry is visible. Exclude idempotent close/stop, draining accepted
        work, diagnostics, per-operation terminality, and valid pool
        generations. Choose insufficient_context when terminality or the
        governing contract is not visible.
      criteria:
        terminal_reentry: >-
          A source-established terminal state has a reachable operation that
          accepts new work, performs a stateful effect, or reacquires a
          resource without rejection and without a proven restart, reset,
          reinitialization, or fresh generation.
        valid_restart_or_reuse: >-
          An explicit restart, reset, reinitialization, or fresh generation
          governs the new operation.
        allowed_terminal_operation: >-
          The terminal operation is explicitly allowed, idempotent close/stop,
          draining accepted work, per-operation terminality, read-only
          diagnostics, or another stated terminal contract.
        no_terminal_reentry: >-
          No qualifying terminal-state reentry is visible.
        insufficient_context: >-
          The terminal state or the restart/reinitialization contract is not
          established by the supplied evidence.
    report:
      message: "A terminal state appears to be resurrected without an explicit restart or reinitialization contract."
      choices: [terminal_reentry]
      uncertain_choices: [insufficient_context]
      levels:
        warning:
          min_probability: 0.45
          min_confidence: 0.50
        error:
          min_probability: 0.92
          min_confidence: 0.70
  - name: JEV12
    title: hidden-caller-relevant-effect
    ruleset: JEV
    enabled: true
    languages:
    - python
    - rust
    - perl
    - typescript
    - javascript
    enrich_on:
    - missing_evidence
    - reduced_context
    enrichment_families:
    - callers
    - callees
    - tests
    - enclosing_context
    target: unit
    context: owner
    applies_to:
    - function
    - method
    - closure
    require_body: true
    targeted_enrichment:
      when_choices:
      - insufficient_context
    question:
      type: choice
      instructions: 'Select exactly one outcome for the complete callable. First ask
        the counterfactual: if this effect were made explicit at the caller-facing boundary,
        would a caller have to reason differently about sequencing, failure, state,
        ownership, retries, lifecycle, correctness, or externally visible behavior?
        Choose hidden_caller_relevant_effect only when the target itself visibly owns
        or directly coordinates a material consequence, that counterfactual is yes,
        and the consequence is not reasonably signaled by the callable name, typed contract,
        effect-bearing type or result, explicit operation, or surrounding control flow.
        Reviewer visibility inside a callee is not the test: an opaque callee is insufficient_context
        unless the target''s caller-facing consequence is established. Do not infer
        a finding from effect existence, density, line count, I/O syntax, a helper call,
        or a surprising implementation. Dense pure pipelines are not_applicable. Dense
        explicitly effectful pipelines, conventional verbs such as commit, flush, send,
        refresh_cache, and retry_request, explicit typed contracts, and honest encapsulation
        are explicit_effect_contract when the caller-facing consequence is appropriately
        signaled. Choose non_observable_memoization for cache fill that does not change
        caller correctness, ownership, lifecycle, retry, sequencing, or visible behavior.
        Choose observability_only for diagnostics that do not alter caller obligations.
        Choose not_applicable when no material caller-relevant consequence is visible.
        Choose insufficient_context when materiality, attribution, caller relevance,
        transparency, or the transitive contract cannot be established.'
      criteria:
        hidden_caller_relevant_effect: The target visibly owns or coordinates a material
          effect or consequence that would change a caller's reasoning about sequencing,
          failure, state, ownership, retries, lifecycle, correctness, or externally
          visible behavior if made explicit, and the target does not reasonably signal
          that consequence through its name, type, result, operation, or surrounding
          flow.
        explicit_effect_contract: A material effect is appropriately signaled to callers
          by a conventional effect verb, explicit typed contract or effect-bearing result,
          visible operation, surrounding control flow, documented ownership, or honest
          encapsulation. Effect existence alone is not a defect.
        non_observable_memoization: Cache fill or memoization is not caller-observable
          and does not change caller correctness, ownership, lifecycle, retry, sequencing,
          or visible behavior.
        observability_only: Logging, metrics, tracing, or equivalent diagnostics do
          not alter caller-facing semantic obligations.
        not_applicable: No material caller-relevant consequence is visible, including
          a pure pipeline.
        insufficient_context: A possible consequence is visible, but its materiality,
          attribution, caller relevance, caller-facing transparency, or transitive contract
          cannot be established from the supplied evidence.
    report:
      message: A callable may conceal a material consequence that callers need for correct
        local reasoning.
      blocks_exit: false
      choices:
      - hidden_caller_relevant_effect
      not_applicable_choices:
      - not_applicable
      uncertain_choices:
      - insufficient_context
      levels:
        warning:
          min_probability: 0.49
          min_confidence: 0.38
        error:
          min_probability: 0.92
          min_confidence: 0.7
  - name: JEV13
    title: hidden-caller-relevant-prerequisite
    ruleset: JEV
    enabled: true
    languages:
    - python
    - rust
    - perl
    - typescript
    - javascript
    enrich_on:
    - missing_evidence
    - reduced_context
    enrichment_families:
    - callers
    - callees
    - tests
    - enclosing_context
    target: unit
    context: owner
    applies_to:
    - function
    - method
    - closure
    require_body: true
    targeted_enrichment:
      when_choices:
      - insufficient_context
    question:
      type: choice
      instructions: 'Select exactly one outcome for an apparently self-contained operation
        in the target. Choose hidden_caller_relevant_prerequisite only when the source
        establishes that the operation is valid only after a prior setup, initialization,
        phase transition, or temporal obligation, the operation relies on state established
        by that prior phase, and the visible API, type, state model, name, and local
        contract do not communicate the ordering. Require a source-visible valid path
        or caller that performs the prior phase before the operation, and require that
        the prerequisite is not represented by a phase-specific handle, typestate, state-bearing
        API, context manager, RAII or ownership mechanism, transaction object, or equivalent.
        Do not report explicit prepare/execute sequencing, phase-specific handles, context
        managers, RAII, transaction objects, type- or state-encoded prerequisites, clear
        local rejection of an explicitly communicated prerequisite, or ordinary local
        lifecycle pairing. Do not infer a finding from a method call sequence, mutable
        field, null assertion, panic, unwrap, exception, or caller convention alone.
        Apply the outcomes exclusively and in precedence order: not_applicable when
        no genuine required prior phase exists, including a transaction object that
        does not encode such a phase; ordinary_lifecycle_pairing for a conventional
        locally established open/use/close, scope/RAII, start/stop, lock/unlock, or
        acquire/release pairing with no hidden caller prerequisite; encoded_phase_state
        only when a genuine required prior phase exists and a phase-specific type, handle,
        context, RAII, transaction, or equivalent representation communicates or prevents
        invalid ordering. Choose explicit_phase_contract when the API or local contract
        clearly communicates the required ordering. Choose explicit_local_rejection
        when the operation clearly rejects an unmet and communicated prerequisite before
        performing its operation. Choose insufficient_context when the dependency, valid
        ordering, contract, enforcement, or caller burden cannot be established.'
      criteria:
        hidden_caller_relevant_prerequisite: The target visibly relies on state or a
          temporal condition established by a prior phase; a valid caller or owner path
          performs that phase first; and the visible API, type, state model, name, and
          local contract neither communicate nor encode the obligation nor clearly reject
          an unmet prerequisite.
        explicit_phase_contract: The required ordering is explicitly communicated by the
          API, method contract, documentation, or visible phase protocol.
        encoded_phase_state: A genuine required prior phase exists, and a phase-specific
          handle, typestate, state transition, context manager, RAII or ownership mechanism,
          transaction object, or equivalent representation communicates or prevents
          invalid ordering.
        explicit_local_rejection: The operation checks and clearly rejects an unmet
          prerequisite before doing the operation under a visible contract.
        ordinary_lifecycle_pairing: Conventional local ownership or lifecycle pairing
          is itself visible and creates no hidden caller prerequisite.
        not_applicable: No genuine required prior phase, setup, initialization, or temporal
          prerequisite exists, including a transaction object that does not encode such
          a phase.
        insufficient_context: A possible prerequisite is visible, but dependency, ordering,
          contract, enforcement, caller path, or burden is unresolved.
    report:
      message: An operation appears to require an uncommunicated prior phase or setup
        step.
      blocks_exit: false
      choices:
      - hidden_caller_relevant_prerequisite
      not_applicable_choices:
      - not_applicable
      uncertain_choices:
      - insufficient_context
      levels:
        warning:
          min_probability: 0.6
          min_confidence: 0.5
        error:
          min_probability: 0.92
          min_confidence: 0.7
  - name: JEV14
    title: stale-derived-representation
    ruleset: JEV
    enrich_on:
    - missing_evidence
    - reduced_context
    enrichment_families:
    - callers
    - callees
    - tests
    - enclosing_context
    target: unit
    context: owner
    applies_to:
    - function
    - method
    - closure
    require_body: true
    targeted_enrichment:
      when_choices:
      - insufficient_context
    question:
      type: choice
      instructions: Select exactly one outcome for derived state in the target. Choose
        derived_incoherence only when exactly one visible authoritative representation
        and one derived cache, index, denormalized value, or projection describe the
        same fact, a reachable normal mutation leaves the derived form usable without
        update, invalidation, or version check, and a consumer can observe a wrong or
        conflicting result. Exclude metrics, diagnostics, ranking, competing authorities,
        and failure-only partial writes. Choose coherent_or_intentional when the derivation
        is maintained, invalidated, boundedly stale by contract, or no qualifying relation
        is visible. Choose insufficient_context when authority, derivation, reachability,
        or the freshness contract is not visible.
      criteria:
        derived_incoherence: Exactly one authoritative representation and a derived
          representation of the same fact are visible; a normal reachable mutation leaves
          the derived form usable without update, invalidation, or version check; and
          a consumer can observe a wrong or conflicting result.
        coherent_or_intentional: The derivation is updated, recomputed, invalidated,
          versioned, replaced from one snapshot, explicitly boundedly stale, or no qualifying
          relationship is visible. Metrics, diagnostics, ranking, competing authorities,
          and failure-only partial writes do not qualify.
        insufficient_context: The source, derived relationship, or freshness contract
          cannot be established by the supplied evidence.
    report:
      message: Derived state appears to remain stale after its authoritative source
        changes.
      blocks_exit: false
      choices:
      - derived_incoherence
      uncertain_choices:
      - insufficient_context
      levels:
        warning:
          min_probability: 0.4
