# Project rules and overrides merge by name; built-ins remain active unless disabled or ignored.
version: 4
scan:
  include: ['*.py', '*.pyi', '*.rs', '*.pl', '*.pm', '*.t', '*.ts', '*.tsx', '*.mts', '*.cts', '*.js', '*.jsx',
    '*.mjs', '*.cjs']
  exclude: [.git/, .venv/, venv/, node_modules/, target/, dist/, build/, __pycache__/, .jevscan-cache/, vendor/,
    '*.min.js']
  respect_gitignore: true
  jobs: 0
  batch_size: 8
  queue_size: 8
  max_file_bytes: 2000000
  max_units_per_file: 10000
  max_full_file_lines: 3000
jev:
  model: jev-latest
  concurrency: 16
  requests_per_minute: 600
  timeout_seconds: 30
  retries: 3
  max_retry_delay: 60
evaluation:
  max_context_tokens: 28000
  max_total_tokens: 56000
  token_reserve: 512
  bytes_per_token: 3.0
  max_request_bytes: 1048576
  max_questions: 128
  oversized_context: reduce
compaction:
  context_tokens: 24000
  max_rounds: 3
  max_candidates: 32
  max_calls_per_file: 12
  semantic: true
enrichment:
  enabled: true
  mode: targeted
  max_checks_per_file: 12
  max_calls_per_file: 36
  max_candidates: 12
  max_evidence: 3
  min_route_probability: 0.7
  min_route_confidence: 0.5
  min_relevance: 0.65
  max_source_files: 1000
  max_source_bytes: 16777216
  min_evidence_probability: 0.6
budget:
  max_requests: 1500
  max_input_tokens: 5000000
  max_cost: null
  input_cost_per_million: 0.042
cache:
  enabled: true
  path: .jevscan-cache/results.sqlite3
  ttl_seconds: 86400
lint:
  select: [ALL]
  ignore: []
rulesets:
  JEV:
    enabled: true
    description: Built-in semantic code-quality checks
  project:
    enabled: true
    description: Project-specific checks
rules:
  - name: JEV01
    title: mixed-responsibilities
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callees, enclosing_context]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    question:
      type: noul
      instructions: Does the target interleave two or more independently meaningful responsibilities inside one
        operation, rather than only orchestrating cohesive steps?
      criteria:
        "true": The target implements multiple independently meaningful responsibilities whose control or state handling
          is interleaved.
        "false": The target has one coherent responsibility or only delegates cohesive steps; no concrete interleaving is
          shown.
    report:
      message: This operation appears to interleave responsibilities that would be clearer as distinct operations.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.71
        error:
          min_probability: 0.9
  - name: JEV02
    title: unclear-control-flow
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callees, enclosing_context]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    question:
      type: score
      instructions: Select the level that describes how many important execution transitions in the target are
        obscured by its control-flow structure. Judge path traceability, not domain difficulty or line count.
      criteria: ['0: The main path and each important transition are direct and explicit.',
        '1: One local nesting or branch complication exists, but all important transitions remain easy to trace.',
        '2: Multiple nested or interleaved branches obscure at least one important transition.',
        '3: Important transitions are scattered or tangled enough that the main path cannot be reconstructed directly.']
    report:
      message: Interleaved concerns or nesting appear to obscure the main execution path.
      levels:
        warning:
          min_score: 1.52
          min_confidence: 0.7
        error:
          min_score: 2.0
          min_confidence: 0.7
  - name: JEV03
    title: mixed-abstraction-levels
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callees, enclosing_context]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    question:
      type: noul
      instructions: Does substantial low-level implementation obscure this operation's high-level orchestration?
      criteria:
        "true": Orchestration interleaves substantial parsing, resource bookkeeping, or similar detail.
        "false": One abstraction level, or necessary detail that does not obscure the operation.
    report:
      message: High-level orchestration appears mixed with substantial low-level implementation detail.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.56
        error:
          min_probability: 0.9
  - name: JEV04
    title: redundant-validation
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callers, callees]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    applicability:
      requires_any: [validation_candidate]
    targeted_enrichment:
      when_choices: [insufficient_context]
    question:
      type: choice
      instructions: Classify two visible checks of the same invariant. With no repeated check, choose justified_or_absent;
        with a repeated check but unknown guarantee or boundary, choose insufficient_context.
      criteria:
        demonstrably_redundant: An established invariant is checked again without a new boundary, mutation, or race.
        justified_or_absent: No repeated check, or a new boundary or invalidation justifies it.
        insufficient_context: Repeated check visible; upstream guarantee or boundary is unknown.
    report:
      message: A validation check appears to repeat an invariant explicitly established in the supplied code.
      choices: [demonstrably_redundant]
      uncertain_choices: [insufficient_context]
      levels:
        warning:
          min_probability: 0.6
          min_confidence: 0.45
        error:
          min_probability: 0.92
          min_confidence: 0.7
  - name: JEV05
    title: hidden-invariant-failure
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callers, callees, tests]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    applicability:
      requires_any: [fallback_candidate]
    targeted_enrichment:
      when_choices: [insufficient_context]
    question:
      type: choice
      instructions: Classify a visible fallback, swallowed failure, or best-effort continuation. If none is visible,
        choose legitimate_behavior; if its governing invariant or failure contract is unknown, choose insufficient_context.
      criteria:
        concealed_bug: Fallback silently hides violation of a source-established invariant.
        legitimate_behavior: No fallback, or it handles a real runtime failure, invalid input, or optional behavior.
        insufficient_context: Fallback visible, but invariant or intended failure contract is unknown.
    report:
      message: A fallback or swallowed failure appears to conceal a violation of an established internal invariant.
      choices: [concealed_bug]
      uncertain_choices: [insufficient_context]
      levels:
        warning:
          min_probability: 0.6
          min_confidence: 0.5
        error:
          min_probability: 0.92
          min_confidence: 0.7
  - name: JEV06
    title: unhelpful-decomposition
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context, applicability]
    enrichment_families: [callees, enclosing_context]
    require_members: true
    target: unit
    context: owner
    applies_to: [class, impl, package, module]
    applicability:
      requires_any: [helper_relationship]
    targeted_enrichment:
      when_choices: [insufficient_context]
    question:
      type: choice
      instructions: Classify an implemented caller/helper relationship. Without one choose not_applicable; with one
        but a missing implementation or caller choose insufficient_context.
      criteria:
        meaningful: Helper hides a coherent operation or fulfills an interface, clarifying the caller.
        needless_indirection: Helper only forwards or moves lines, making the caller less clear.
        not_applicable: No implemented caller/helper decomposition.
        insufficient_context: Relationship visible; missing caller or helper prevents classification.
    report:
      message: Helper indirection appears to obscure the caller without providing meaningful decomposition.
      choices: [needless_indirection]
      not_applicable_choices: [not_applicable]
      uncertain_choices: [insufficient_context]
      levels:
        warning:
          min_probability: 0.45999999999999996
          min_confidence: 0.29
        error:
          min_probability: 0.9
          min_confidence: 0.7
  - name: JEV07
    title: fragmented-ownership
    ruleset: JEV
    enrich: false
    enrich_on: [missing_evidence, reduced_context]
    target: file
    context: file
    question:
      type: noul
      instructions: Do conflicting owners of the same state or lifecycle create a synchronization obligation?
      criteria:
        "true": Multiple authorities for the same state or transition require synchronization.
        "false": One authority, a derived cache, or intentional synchronization without ownership conflict.
    report:
      message: State or lifecycle bookkeeping appears to have competing authoritative owners.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.5
        error:
          min_probability: 0.92
  - name: JEV08
    title: incohesive-owner
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callees, enclosing_context]
    target: unit
    context: owner
    applies_to: [class, impl, package, module]
    applicability:
      requires_any: [executable_behavior]
    question:
      type: noul
      instructions: Does this owner combine unrelated responsibilities with weakly connected state or behavior?
      criteria:
        "true": Multiple weakly connected responsibilities lack a cohesive boundary.
        "false": Cohesive owner, aggregate, facade, or required interface; method count alone is insufficient.
    report:
      message: This owner appears to combine unrelated state and behavior.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.47
        error:
          min_probability: 0.9
  - name: JEV09
    title: duplicated-behavior
    ruleset: JEV
    enrich: false
    enrich_on: [missing_evidence, reduced_context]
    target: file
    context: file
    question:
      type: noul
      instructions: Is the same owned behavior implemented twice, requiring synchronized maintenance?
      criteria:
        "true": Materially duplicated implementations must be kept in sync.
        "false": Only syntax overlaps, or distinct boundaries or required interfaces explain the similarity.
    report:
      message: The same owned behavior appears implemented more than once and may need to be maintained in sync.
      uncertain_range: [0.4, 0.6]
      levels:
        warning:
          min_probability: 0.73
        error:
          min_probability: 0.93
  - name: JEV10
    title: unaccounted-partial-state-transition
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callees, enclosing_context]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    applicability:
      requires_any: [state_transition_candidate]
    targeted_enrichment:
      when_choices: [insufficient_context]
    question:
      type: choice
      instructions: >-
        Are two coupled, externally visible state changes left partially
        applied on a reachable failure, cancellation, early return, or retry?
        Require visible effects and an invalid partial state. Do not count
        independent telemetry/cache updates, temporary construction, or
        complete build-then-publish. Explicitly progressive or restartable
        workflows are accounted, not defects.
      criteria:
        unaccounted_partial_transition: >-
          Coupled visible effects can be left partially applied, without
          atomicity, rollback, compensation, reconciliation, or a valid
          intermediate-state contract.
        accounted_transition: >-
          No coupled partial effect, or atomicity, rollback, reconciliation,
          compensation, or a progressive/restartable contract accounts for it;
          independent best-effort telemetry is not a coupled effect.
        insufficient_context: >-
          Reachability or the partial-state contract is unknown.
    report:
      message: A partial state transition appears to be left unaccounted for.
      choices: [unaccounted_partial_transition]
      uncertain_choices: [insufficient_context]
      levels:
        warning:
          min_probability: 0.6
          min_confidence: 0.5
        error:
          min_probability: 0.92
          min_confidence: 0.7
  - name: JEV11
    title: terminal-state-reentry
    ruleset: JEV
    enrich_on: [missing_evidence, reduced_context]
    enrichment_families: [callers, callees, tests, enclosing_context]
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    targeted_enrichment:
      when_choices: [insufficient_context]
    question:
      type: choice
      instructions: >-
        After a source-proven terminal state, does a reachable operation
        accept new work, change state, or reacquire a resource without
        rejection or valid restart? Exclude idempotent close, draining,
        diagnostics, and per-operation terminality.
      criteria:
        terminal_reentry: >-
          After a proven terminal state, a reachable operation accepts new work
          or has a stateful effect without rejection or a valid restart.
        valid_restart_or_reuse: >-
          Explicit restart, reset, reinitialization, or fresh generation permits the operation.
        allowed_terminal_operation: >-
          Explicitly allowed terminal operation, idempotent close/stop,
          draining, diagnostics, or per-operation terminality.
        no_terminal_reentry: >-
          No qualifying reentry is visible.
        insufficient_context: >-
          Terminality or the governing restart contract is not established.
    report:
      message: "A terminal state appears to be resurrected without an explicit restart or reinitialization contract."
      choices: [terminal_reentry]
      uncertain_choices: [insufficient_context]
      levels:
        warning:
          min_probability: 0.45
          min_confidence: 0.50
        error:
          min_probability: 0.92
          min_confidence: 0.70
  - name: JEV12
    title: hidden-caller-relevant-effect
    ruleset: JEV
    enabled: true
    languages:
    - python
    - rust
    - perl
    - typescript
    - javascript
    enrich_on:
    - missing_evidence
    - reduced_context
    enrichment_families:
    - callers
    - callees
    - tests
    - enclosing_context
    target: unit
    context: owner
    applies_to:
    - function
    - method
    - closure
    require_body: true
    targeted_enrichment:
      when_choices:
      - insufficient_context
    question:
      type: choice
      instructions: >-
        Does this callable conceal an owned material effect that would change
        caller reasoning about failure, state, ownership, order, or retries?
        Effect existence, complexity, and opaque callees alone do not qualify.
        A clear name, contract, result, or operation can signal the effect.
      criteria:
        hidden_caller_relevant_effect: A source-visible, material consequence
          changes caller obligations without a clear name, type, result,
          contract, or visible operation.
        explicit_effect_contract: The caller-facing effect is signaled by
          a verb, type, result, contract, or visible operation.
        non_observable_memoization: Cache fill has no caller-relevant effect
          on correctness, ownership, or behavior.
        observability_only: Diagnostics do not change caller obligations.
        not_applicable: No material caller-relevant effect; pure computation qualifies.
        insufficient_context: Materiality, caller impact, or transparency
          cannot be established from supplied source.
    report:
      message: A callable may conceal a material consequence that callers need for correct
        local reasoning.
      blocks_exit: false
      choices:
      - hidden_caller_relevant_effect
      not_applicable_choices:
      - not_applicable
      uncertain_choices:
      - insufficient_context
      levels:
        warning:
          min_probability: 0.49
          min_confidence: 0.38
        error:
          min_probability: 0.92
          min_confidence: 0.7
  - name: JEV13
    title: hidden-caller-relevant-prerequisite
    ruleset: JEV
    enabled: true
    languages:
    - python
    - rust
    - perl
    - typescript
    - javascript
    enrich_on:
    - missing_evidence
    - reduced_context
    enrichment_families:
    - callers
    - callees
    - tests
    - enclosing_context
    target: unit
    context: owner
    applies_to:
    - function
    - method
    - closure
    require_body: true
    targeted_enrichment:
      when_choices:
      - insufficient_context
    question:
      type: choice
      instructions: >-
        Does a source-proven required prior phase leave an undisclosed
        caller obligation? Require a valid path that performs setup first
        and state this operation relies on. A call sequence, mutable field,
        assertion, or name alone proves nothing. Without a real required
        phase choose not_applicable, not encoded_phase_state.
      criteria:
        hidden_caller_relevant_prerequisite: A required prior phase and valid
          path are visible; API, type, name, and contract do not communicate,
          encode, or reject its absence.
        explicit_phase_contract: The required ordering is communicated by the
          API or phase contract.
        encoded_phase_state: A real required phase is conveyed or enforced
          by a phase-specific type, handle, context, RAII, or transaction.
        explicit_local_rejection: An unmet, communicated prerequisite is
          rejected before the operation.
        ordinary_lifecycle_pairing: Local open/use/close or acquire/release
          has no hidden caller obligation.
        not_applicable: No required prior phase, including a transaction
          object with no phase obligation.
        insufficient_context: Dependency, ordering, contract, or caller
          burden is unresolved.
    report:
      message: An operation appears to require an uncommunicated prior phase or setup
        step.
      blocks_exit: false
      choices:
      - hidden_caller_relevant_prerequisite
      not_applicable_choices:
      - not_applicable
      uncertain_choices:
      - insufficient_context
      levels:
        warning:
          min_probability: 0.6
          min_confidence: 0.5
        error:
          min_probability: 0.92
          min_confidence: 0.7
  - name: JEV14
    title: stale-derived-representation
    ruleset: JEV
    enrich_on:
    - missing_evidence
    - reduced_context
    enrichment_families:
    - callers
    - callees
    - tests
    - enclosing_context
    target: unit
    context: owner
    applies_to:
    - function
    - method
    - closure
    require_body: true
    targeted_enrichment:
      when_choices:
      - insufficient_context
    question:
      type: choice
      instructions: >-
        Is a derived copy stale after a normal reachable mutation of one
        source of truth, with observable consumer harm? Exclude metrics,
        ranking, competing authorities, failure-only writes, and permitted
        bounded staleness.
      criteria:
        derived_incoherence: One authority changes; its derived copy remains
          usable without refresh, invalidation, or version check; a consumer
          can observe an incorrect result.
        coherent_or_intentional: Kept in sync, invalidated, versioned,
          intentionally stale, or no qualifying source/derived relation.
        insufficient_context: Authority, derivation, reachability,
          consumer impact, or freshness contract is unknown.
    report:
      message: Derived state appears to remain stale after its authoritative source
        changes.
      blocks_exit: false
      choices:
      - derived_incoherence
      uncertain_choices:
      - insufficient_context
      levels:
        warning:
          min_probability: 0.4
          min_confidence: 0.25
        error:
          min_probability: 0.92
          min_confidence: 0.7
  - name: JEV15
    title: unsafe-retry-after-source-established-unknown-completion
    ruleset: JEV
    enabled: true
    languages:
    - python
    - rust
    - perl
    - typescript
    - javascript
    enrich: true
    enrich_on:
    - missing_evidence
    - reduced_context
    enrichment_families:
    - callers
    - callees
    - tests
    target: unit
    context: owner
    applies_to:
    - function
    - method
    - closure
    require_body: true
    targeted_enrichment:
      when_choices:
      - insufficient_context
    question:
      type: choice
      instructions: >-
        Unsafe retry requires source-visible external effect before unknown
        completion, reachable replay of that SAME logical effect, and
        concrete duplicate/reorder harm. Timeout or opaque provider contracts
        alone prove neither ambiguity nor safety. Deduplication, operation
        IDs, replay-safe contracts, or reconciliation can prevent harm.
      criteria:
        unsafe_retry: Source proves an effect before unknown completion,
          replay of the same effect, and duplicate/reorder harm with no
          visible deduplication or recovery.
        safe_retry: Source proves ambiguous replay plus deduplication,
          replay-safe implementation, or compensation preventing harm.
        explicitly_nonretryable: Ambiguity is surfaced as pending or
          non-retryable; the effect is not replayed.
        not_applicable: No qualifying external dispatch and replay shape.
        insufficient_context: Ambiguity, effect identity, harm, or retry
          safety is not established by supplied source.
    report:
      message: An externally visible effect appears to be replayed after a source-established
        ambiguous completion without a retry-safety contract.
      blocks_exit: false
      choices:
      - unsafe_retry
      not_applicable_choices:
      - not_applicable
      uncertain_choices:
      - insufficient_context
      levels:
        warning:
          min_probability: 0.46
          min_confidence: 0.33
        error:
          min_probability: 0.92
          min_confidence: 0.7
  - name: JEV16
    title: untruthful-success-signal
    ruleset: JEV
    enrich_on:
    - missing_evidence
    - reduced_context
    enrichment_families:
    - callers
    - callees
    - tests
    - enclosing_context
    target: unit
    context: owner
    applies_to:
    - function
    - method
    - closure
    require_body: true
    targeted_enrichment:
      when_choices:
      - insufficient_context
    question:
      type: choice
      instructions: >-
        Does a reachable success/completion/readiness signal falsely claim
        a required externally observable result that has not happened?
      criteria:
        false_success: Full success is reported on a reachable path missing
          a required externally observable result, hiding failure or partial state.
        truthful_success: Failure propagates, or full success follows the
          required result; optional telemetry may fail independently.
        explicit_partial_success: Accepted, pending, or partial status
          honestly distinguishes incomplete work from full success.
        not_applicable: No established required postcondition paired
          with a success signal.
        insufficient_context: Requiredness, reachability, or the
          signal's meaning is not established.
    report:
      message: A success signal appears reachable without a required externally observable
        postcondition.
      blocks_exit: false
      choices:
      - false_success
      not_applicable_choices:
      - not_applicable
      uncertain_choices:
      - insufficient_context
      levels:
        warning:
          min_probability: 0.59
          min_confidence: 0.49
        error:
          min_probability: 0.92
          min_confidence: 0.7
