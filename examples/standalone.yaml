# This file REPLACES the packaged rules; only these two checks run.
version: 1
jev:
  concurrency: 16
  requests_per_minute: 600

rules:
  cohesive-callable:
    applies_to: [function, method, closure]
    require_body: true
    question:
      type: noul
      instructions: >
        Does `source` interleave unrelated responsibilities in a way
        that materially obscures its main operation? Do not flag
        necessary complexity or length alone.
    report:
      severity: warning
      message: Several responsibilities appear interleaved in this operation.
      min_probability: 0.90

  owner-cohesion:
    applies_to: [class, impl, trait, interface, package, module]
    question:
      type: choice
      instructions: >
        Which description best fits the responsibilities owned by `source`?
        Use only supplied evidence, not hypothetical requirements or callers.
      criteria:
        cohesive: Members serve one coherent responsibility.
        mixed: Several unrelated responsibilities are combined under one owner.
        unknown: The supplied implementation is too limited to judge.
    report:
      severity: warning
      message: This owner appears to combine unrelated responsibilities.
      choices: [mixed]
      min_probability: 0.92
      min_confidence: 0.70
