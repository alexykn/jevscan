schema_version: 1
corpus: public-synthetic-jev
corpus_revision: 3
provenance: "synthetic, model-generated; not independent ground truth"
source_root: sources
source_snapshot:
  algorithm: sha256
  canonicalization: "sorted source filenames, each followed by NUL and raw UTF-8 bytes"
  digest: 6393505d40cd945c81a27481ebbbda894f19338cef864f7ce138b748ec11568b
source_contract:
  evidence_files_are_neutral: true
  labels_are_outside_source_root: true
  validation: "real Tree-sitter parse_source followed by the production Planner"
  scenario_group_policy: "paired or translated versions share one group and are not independent held-out cases"
  live_measurement_policy: "do not claim model accuracy until blind adjudication and live measurements"
coverage_notes:
  independent_semantic_scenarios_are_limited: true
  current_focus: "JEV01 and JEV05 have additional independent paired groups; JEV04 and JEV06 retain explicit ambiguity groups."
  remaining_gap: "This is a small synthetic calibration corpus, not complete coverage of every language construct or domain contract."

rule_contracts:
  - name: JEV01
    title: mixed-responsibilities
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    applicability: none
    question:
      type: noul
      proposition: "Does the target interleave two or more independently meaningful responsibilities inside one operation, rather than only orchestrating cohesive steps?"
      true_criteria: "The target implements multiple independently meaningful responsibilities whose control or state handling is interleaved."
      false_criteria: "The target has one coherent responsibility or only delegates cohesive steps; no concrete interleaving is shown."
    report:
      message: "This operation appears to interleave responsibilities that would be clearer as distinct operations."
      warning: {min_probability: 0.5}
      error: {min_probability: 0.9}
      severity: "warning or error according to the probability gate"

  - name: JEV02
    title: unclear-control-flow
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    applicability: none
    question:
      type: score
      proposition: "Select the level that describes how many important execution transitions in the target are obscured by its control-flow structure. Judge path traceability, not domain difficulty or line count."
      criteria:
        "0": "The main path and each important transition are direct and explicit."
        "1": "One local nesting or branch complication exists, but all important transitions remain easy to trace."
        "2": "Multiple nested or interleaved branches obscure at least one important transition."
        "3": "Important transitions are scattered or tangled enough that the main path cannot be reconstructed directly."
    report:
      message: "Interleaved concerns or nesting appear to obscure the main execution path."
      warning: {min_score: 1.0, min_confidence: 0.6}
      error: {min_score: 2.0, min_confidence: 0.7}
      severity: "warning or error according to score and confidence gates"

  - name: JEV03
    title: mixed-abstraction-levels
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    applicability: none
    question:
      type: noul
      proposition: "Does the target mix high-level orchestration with a substantial low-level implementation concern that obscures its primary operation?"
      true_criteria: "The target interleaves orchestration with substantial parsing, resource bookkeeping, or other low-level detail."
      false_criteria: "The target stays at one abstraction level, or its small necessary details and cleanup do not obscure the primary operation."
    report:
      message: "High-level orchestration appears mixed with substantial low-level implementation detail."
      warning: {min_probability: 0.5}
      error: {min_probability: 0.9}
      severity: "warning or error according to the probability gate"

  - name: JEV04
    title: redundant-validation
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    applicability:
      requires_any: [validation_candidate]
    question:
      type: choice
      proposition: "Select exactly one outcome for repeated validation in the target."
      criteria:
        demonstrably_redundant: "A visible operation establishes a specific invariant and the target later checks that same invariant again without a new boundary, mutation, or concurrency risk."
        justified_or_absent: "No repeated validation is visible, or every visible repeat follows a new boundary or possible invalidation."
        insufficient_context: "A concrete repeated validation is visible, but the missing upstream guarantee or boundary fact is required to choose between redundant and justified_or_absent."
      defect_choices: [demonstrably_redundant]
      uncertain_choices: [insufficient_context]
    report:
      message: "A validation check appears to repeat an invariant explicitly established in the supplied code."
      warning: {min_probability: 0.6, min_confidence: 0.5}
      error: {min_probability: 0.92, min_confidence: 0.7}
      severity: "warning or error according to probability and confidence gates"

  - name: JEV05
    title: hidden-invariant-failure
    target: unit
    context: owner
    applies_to: [function, method, closure]
    require_body: true
    applicability:
      requires_any: [fallback_candidate]
    question:
      type: choice
      proposition: "Select exactly one outcome for fallback or swallowed-failure behavior visible in the target."
      criteria:
        concealed_bug: "A visible fallback or swallowed failure silently hides a violation of an invariant established by the supplied evidence."
        legitimate_behavior: "No fallback or swallowed failure is visible, or the behavior handles a legitimate runtime condition such as I/O failure, cancellation, input error, or documented optional behavior."
        insufficient_context: "A concrete fallback or swallowed failure is visible, but a missing invariant or intended failure contract is required to choose between concealed_bug and legitimate_behavior."
      defect_choices: [concealed_bug]
      uncertain_choices: [insufficient_context]
    report:
      message: "A fallback or swallowed failure appears to conceal a violation of an established internal invariant."
      warning: {min_probability: 0.6, min_confidence: 0.5}
      error: {min_probability: 0.92, min_confidence: 0.7}
      severity: "warning or error according to probability and confidence gates"

  - name: JEV06
    title: unhelpful-decomposition
    target: unit
    context: owner
    applies_to: [class, impl, package, module]
    require_members: true
    applicability:
      requires_any: [helper_relationship]
    question:
      type: choice
      proposition: "Select exactly one outcome for helper decomposition in the target."
      criteria:
        meaningful: "Each visible helper hides a coherent operation behind a meaningful name or satisfies an evident interface requirement, and the caller is clearer."
        needless_indirection: "Visible helpers only forward arguments or move lines without hiding meaningful detail, and the caller is less clear because of that indirection."
        not_applicable: "No helper decomposition is visible in the target; data-only types and declarations are not decomposition defects."
        insufficient_context: "Helper decomposition is visibly present, but a missing helper implementation or caller is required to distinguish meaningful from needless_indirection."
      defect_choices: [needless_indirection]
      not_applicable_choices: [not_applicable]
      uncertain_choices: [insufficient_context]
    report:
      message: "Helper indirection appears to obscure the caller without providing meaningful decomposition."
      warning: {min_probability: 0.6, min_confidence: 0.5}
      error: {min_probability: 0.9, min_confidence: 0.7}
      severity: "warning or error according to probability and confidence gates"

  - name: JEV07
    title: fragmented-ownership
    target: file
    context: file
    applies_to: []
    require_body: false
    applicability: none
    question:
      type: noul
      proposition: "Does the file assign the same authoritative state or lifecycle bookkeeping to conflicting owners, creating a concrete synchronization obligation?"
      true_criteria: "Two or more owners visibly act as authoritative for the same state or lifecycle transition, creating a synchronization obligation."
      false_criteria: "State has one authoritative owner, or repeated data is a derived cache or deliberately synchronized representation without a concrete ownership conflict."
    report:
      message: "State or lifecycle bookkeeping appears to have competing authoritative owners."
      warning: {min_probability: 0.5}
      error: {min_probability: 0.92}
      severity: "warning or error according to the probability gate"

  - name: JEV08
    title: incohesive-owner
    target: unit
    context: owner
    applies_to: [class, impl, package, module]
    require_members: false
    applicability:
      requires_any: [executable_behavior]
    question:
      type: noul
      proposition: "Does this owner combine two or more unrelated responsibilities with weakly connected state or behavior?"
      true_criteria: "The owner contains multiple responsibilities with weakly connected state or behavior and no clear cohesive boundary."
      false_criteria: "The owner is cohesive, a domain aggregate or facade, or one implementation of a required interface; method count alone is not evidence."
    report:
      message: "This owner appears to combine unrelated state and behavior."
      warning: {min_probability: 0.5}
      error: {min_probability: 0.9}
      severity: "warning or error according to the probability gate"

  - name: JEV09
    title: duplicated-behavior
    target: file
    context: file
    applies_to: []
    require_body: false
    applicability: none
    question:
      type: noul
      proposition: "Does the file contain materially duplicated implementations of the same owned behavior, creating a maintenance obligation to keep them in sync?"
      true_criteria: "At least two implementations contain materially duplicated owned behavior with a concrete obligation to keep them synchronized."
      false_criteria: "No implementation is materially duplicated behavior, or similarity is explained by a distinct boundary or required implementation."
    report:
      message: "The same owned behavior appears implemented more than once and may need to be maintained in sync."
      warning: {min_probability: 0.5}
      error: {min_probability: 0.93}
      severity: "warning or error according to the probability gate"

