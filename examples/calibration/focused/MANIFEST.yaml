schema_version: 1
corpus: public-focused-questions
corpus_revision: 1
provenance: "synthetic fixture corpus with provisional review annotations; labels are not human ground truth"
source_root: sources
source_snapshot:
  algorithm: sha256
  canonicalization: "sorted relative source filenames, each followed by NUL and raw UTF-8 bytes"
  digest: 20810613ebdea6743a47417492743c45ad3a19893156e440eb5cf851ec41a837
source_contract:
  evidence_files_are_neutral: true
  labels_are_outside_source_root: true
  validation: "real Tree-sitter parse_source followed by production ContextBuilder and Planner"
  related_variants_share_group: true
  fresh_heldout_only: "entries under heldout; development_references are not fresh heldout evidence"
  live_model_calls: none
  label_vocabulary: [positive, negative, Partial]
  optional_case_fields:
    - source_commit
    - source_sha256
    - target_sha256
    - expected_score
    - additional_sources
coverage:
  affected_rules: [JEV01, JEV02, JEV04]
  heldout_groups_per_rule:
    JEV01: {positive: 3, negative: 3, total: 6}
    JEV02: {positive: 2, negative: 4, total: 6}
    JEV04: {positive: 3, negative: 3, total: 6}
  split_assignment: "all six fresh groups per rule are heldout; development imports every independently adjudicated JEV01/JEV02/JEV04 expanded case"
  feature_coverage:
    - callback and await boundary
    - immutable captured values
    - cohesive lifecycle orchestration
    - truly interleaved responsibilities
    - obscure control flow
    - merely local control flow
    - redundant validation
    - justified validation after a boundary
rules:
  - name: JEV01
    title: mixed-responsibilities
    target: unit
    candidate_support: [jev01-baseline, jev01-focused]
  - name: JEV02
    title: unclear-control-flow
    target: unit
    candidate_support: [jev02-baseline, jev02-presence-gated]
  - name: JEV04
    title: redundant-validation
    target: unit
    candidate_support: [jev04-baseline, jev04-focused-joint, jev04-focused-decomposed]

development_references:
