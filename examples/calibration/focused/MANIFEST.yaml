    source: examples/calibration/expanded/sources/flint.ts
    source_group: expanded:JEV01-G05
    rule: JEV01
    label: positive
    target: {scope: unit, name: hydrateProfile, kind: function}
    source_partition_in_expanded: heldout
    development_only: true
    counts_as_fresh_heldout: false
