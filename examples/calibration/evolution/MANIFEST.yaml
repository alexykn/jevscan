source_contract:
  evidence_files_are_neutral: true
  labels_are_outside_source_root: true
  one_exact_target_per_case: true
  translated_designs_share_support_group: true
  no_provider_calls: true
  development_only: true
  validation: "real Tree-sitter parse_source followed by exact target lookup"
  source_only_policy: "Agree and Disagree labels must follow the supplied owner/file evidence; manifest metadata never supplies an omitted durability, coupling, or atomicity contract."
  comparison_scope_policy: "A baseline relation at file scope is recorded explicitly in compared_rule_scope and is never attributed to the unit target."
  live_measurement_policy: "do not treat provisional or adjudicated labels as human ground truth"

dimension:
  id: unaccounted-partial-state-transition
  title: unaccounted-partial-state-transition
  target: unit
  context: owner
  label_vocabulary: [Agree, Partial, Disagree]
  proposition: "Does the target perform semantically coupled persistent state transitions in sequence without accounting for a failure after an earlier effect?"
  exact_condition: "Agree requires visible coupled durable effects where a later failure can leave the logical state inconsistent, and no atomic transaction, rollback, explicit partial-result contract, or valid progressive/restartable contract accounts for that outcome."
  criteria:
    Agree: "The target performs two or more semantically coupled persistent effects, or destroys old durable state before new state is durable, and a later failure can expose an inconsistent transition or a propagated failure after partial commit."
    Partial: "A sequence of effects is visible, but an omitted helper or resource contract determines whether the effects are atomic or semantically coupled."
    Disagree: "The target uses one atomic publication, temp/sync/rename, transaction rollback, an explicit partial-result contract, a valid progressive/restartable workflow, or an independent best-effort side effect; no unaccounted coupled partial transition is shown."
  exclusions:
    - "A failure in an independent audit or telemetry side effect does not make the primary publication partial."
    - "A partial result is not a defect when the return value identifies completion and restart state."
    - "Similar names or sequential calls do not establish coupling or atomicity when the relevant helper/resource contract is omitted."

coverage:
  total_cases: 22
  total_support_groups: 15
  languages: [python, rust, javascript, typescript, perl]
  partitions:
    development: 22
  fixture_classes:
