    independent_best_effort_audit_or_telemetry: [C06]
    isolated_invariant_fallback: [C07]
    competing_owner_without_partial_transition: [C08]
  insufficient_context_families:
    helper_contract_atomicity: [P01]
    resource_contract_atomicity: [P02]
    helper_contract_coupling: [P03]
    resource_contract_coupling: [P04]
  support_group_policy: "A support group is one independent mechanism; language translations and near-duplicate counterparts share one group and count once for independent evidence."
  grouping_review:
    translation_pairs: [T01, T02, T03, C01]
    retained_distinctions:
      T01: "Unhandled and explicitly propagated later failures are one sequential coupled-effect mechanism, not independent support."
      T03: "Authoritative bookkeeping and the swallowed/file-owner overlap share one state-transition invariant."

